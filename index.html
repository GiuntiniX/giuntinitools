<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giuntini Tools</title>
<style>
  :root{
    --bg:#0d0b14;
    --surface:#171225;
    --surface-2:#1f1830;
    --border:#332a4a;
    --text:#F5F1FF;
    --text-dim:#c7bfe6;
    --pink:#FF4D8D;
    --pink-b:#FF8FB8;
    --teal:#22E0C0;
    --teal-b:#7CFFE6;
    --gold:#FFC857;
    --gold-b:#FFE08A;
    --violet:#8A6BFF;
    --violet-b:#B79CFF;
    --blue:#3D8BFF;
    --blue-b:#7CB2FF;
    --orange:#FF8A3D;
    --orange-b:#FFB578;
    --shadow: 0 16px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    height:100vh;
    overflow:hidden;
    position:relative;
  }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(30px,-20px) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-25px,25px) scale(1.1); }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes floatUp{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }

  /* ---------- menu (home) ---------- */
  #menu{
    position:absolute; inset:0; overflow:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px;
    background:var(--bg);
    isolation:isolate;
  }
  .blob{
    position:fixed; border-radius:50%; filter:blur(70px); z-index:-1; opacity:.5; pointer-events:none;
  }
  .blob-1{ width:420px; height:420px; top:-120px; left:-100px; background:var(--pink); animation:drift 12s ease-in-out infinite; }
  .blob-2{ width:380px; height:380px; bottom:-140px; right:-100px; background:var(--violet); animation:drift2 14s ease-in-out infinite; }
  .blob-3{ width:300px; height:300px; top:40%; right:8%; background:var(--teal); opacity:.35; animation:drift 16s ease-in-out infinite reverse; }
  .blob-4{ width:260px; height:260px; bottom:10%; left:6%; background:var(--gold); opacity:.3; animation:drift2 10s ease-in-out infinite; }

  .menu-head{ text-align:center; margin-bottom:44px; position:relative; z-index:1; }
  .menu-brand{
    width:64px; height:64px; border-radius:18px; margin:0 auto 18px;
    background:conic-gradient(from 0deg, var(--pink), var(--gold), var(--teal), var(--violet), var(--pink));
    display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:var(--shadow);
    animation:floatUp 3.5s ease-in-out infinite;
  }
  .menu-brand span{ animation:spin 6s linear infinite; display:inline-block; }
  .menu-head h1{
    margin:0; font-size:32px; font-weight:800; letter-spacing:.3px;
    background:linear-gradient(90deg, var(--pink-b), var(--gold-b), var(--teal-b), var(--violet-b));
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:brandShift 6s ease-in-out infinite;
  }
  @keyframes brandShift{
    0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
  }
  .menu-head p{ margin:10px 0 0; font-size:14.5px; color:var(--text-dim); }

  .card-grid{
    display:grid; grid-template-columns:repeat(2, minmax(240px, 320px)); gap:24px;
    width:100%; max-width:700px; position:relative; z-index:1;
  }
  @media (max-width:620px){ .card-grid{ grid-template-columns:1fr; max-width:360px; } }

  .tool-card{
    position:relative; overflow:hidden; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:28px 24px; box-shadow:var(--shadow);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .tool-card:hover{ transform:translateY(-6px) scale(1.02); }
  .tool-card:focus-visible{ outline:2px solid var(--tool-glow); outline-offset:2px; }
  .tool-card::before{
    content:""; position:absolute; top:-45%; right:-25%; width:200px; height:200px; border-radius:50%;
    background:var(--tool-glow); opacity:.22; filter:blur(36px); pointer-events:none;
    transition:opacity .2s ease;
  }
  .tool-card:hover::before{ opacity:.4; }
  .tool-card#cardQRCodes{ --tool-glow:var(--pink); }
  .tool-card#cardQRCodes:hover{ border-color:var(--pink-b); box-shadow:0 16px 34px -10px rgba(255,77,141,.4); }
  .tool-card#cardPrensa{ --tool-glow:var(--teal); }
  .tool-card#cardPrensa:hover{ border-color:var(--teal-b); box-shadow:0 16px 34px -10px rgba(34,224,192,.4); }

  .tool-icon{
    width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    font-size:21px; color:#181022; flex-shrink:0; font-weight:700;
  }
  .tool-card#cardQRCodes .tool-icon{ background:linear-gradient(135deg, var(--pink), var(--gold)); }
  .tool-card#cardPrensa .tool-icon{ background:linear-gradient(135deg, var(--teal), var(--violet)); color:#0d1420; }

  .tool-card h2{ margin:2px 0 0; font-size:19px; font-weight:800; }
  .tool-card#cardQRCodes h2{
    background:linear-gradient(90deg, var(--orange), var(--pink-b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tool-card#cardPrensa h2{
    background:linear-gradient(90deg, var(--blue), var(--violet-b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tool-card p{ margin:0; font-size:13.5px; color:rgba(245,241,255,.78); line-height:1.55; }
  .tool-open{
    margin-top:8px; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--tool-glow); display:flex; align-items:center; gap:6px;
  }
  .tool-open .arrow{ transition:transform .15s ease; }
  .tool-card:hover .tool-open .arrow{ transform:translateX(4px); }

  .menu-footer{ margin-top:38px; font-size:11.5px; color:var(--text-dim); text-align:center; position:relative; z-index:1; }
  .menu-footer strong{ color:var(--text); }

  /* ---------- tool view ---------- */
  .tool-view{
    position:absolute; inset:0; display:none; flex-direction:column;
  }
  .tool-view.active{ display:flex; }
  .back-bar{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0; z-index:10;
  }
  .back-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:7px; transition:.15s ease;
  }
  .back-btn:hover{ color:var(--text); border-color:var(--violet-b); }
  .back-bar .current-tool{ font-size:12.5px; color:var(--text-dim); }
  .back-bar .current-tool strong{ color:var(--text); }
  .frame-wrap{ flex:1; position:relative; min-height:0; }
  .frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; background:var(--bg); }
</style>

<script>
  const menu = document.getElementById('menu');
  const views = {
    frameQRCodes: document.getElementById('viewQRCodes'),
    framePrensa: document.getElementById('viewPrensa')
  };

  document.querySelectorAll('.tool-card').forEach(card => {
    card.addEventListener('click', () => {
      const target = card.dataset.target;
      menu.style.display = 'none';
      Object.values(views).forEach(v => v.classList.remove('active'));
      views[target].classList.add('active');
    });
  });

  document.querySelectorAll('[data-back]').forEach(btn => {
    btn.addEventListener('click', () => {
      Object.values(views).forEach(v => v.classList.remove('active'));
      menu.style.display = 'flex';
    });
  });
</script>
